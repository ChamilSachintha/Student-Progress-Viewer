<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Define gradients for a premium feel -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Circle with deep indigo/slate gradient -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#334155" stroke-width="8" />

  <!-- Progress Circle (representing student progress, 75% complete ring) -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="url(#ringGrad)" stroke-width="16" stroke-linecap="round" stroke-dasharray="942" stroke-dashoffset="235" transform="rotate(-90 256 256)" filter="url(#glow)" />

  <!-- Minimalist Graduation Cap -->
  <!-- Cap Top (Diamond shape) -->
  <path d="M256 160 L380 210 L256 260 L132 210 Z" fill="url(#capGrad)" />
  
  <!-- Cap Base (Underneath part) -->
  <path d="M190 245 V290 C190 310, 322 310, 322 290 V245" fill="none" stroke="url(#capGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Tassel -->
  <path d="M256 210 L350 250 V310" fill="none" stroke="#60a5fa" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="350" cy="318" r="10" fill="#60a5fa" />
</svg>
